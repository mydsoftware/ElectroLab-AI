name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: نصب وابستگی‌ها
        run: pip install -r requirements-dev.txt
      - name: اجرای تست‌های Backend
        run: pytest -q
      - name: بررسی نحو JavaScript رابط گرافیکی
        run: python scripts/check_frontend.py
      - name: نصب Node.js برای تست‌های هندسی
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: اجرای تست‌های مسیریابی سیم
        run: node --test tests/frontend/*.test.cjs
